<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClezJelly · Your next steps</title>
<style>
:root{
  --bg:#14121f;--card:#1d1a2f;--line:#2e2946;--text:#ece9f8;--mute:#a29cbf;
  --violet:#a78bfa;--pink:#f472b6;--ok:#5fd787;--warn:#ffb454;--err:#ff6b81;--code:#0f0d19;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f6f4fc;--card:#fff;--line:#e2dcf2;--text:#201b35;--mute:#6c6588;--code:#f0edf9;--ok:#1f9d55;--warn:#b86e00;--err:#d6264a}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:820px;margin:0 auto;padding:32px 16px 80px}
h1{font-size:30px;line-height:1.2;margin:0 0 6px;background:linear-gradient(90deg,var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:40px 0 12px}
p{margin:0 0 10px}
.sub{color:var(--mute);margin-bottom:22px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--pink));transition:width .3s}
.pl{font-size:13px;color:var(--mute)}
/* attention */
.alert{border-left:4px solid var(--warn)}
.alert.err{border-left-color:var(--err)}
.alert b{display:block;margin-bottom:2px}
.alert .why{color:var(--mute);font-size:14px;margin-bottom:8px}
.good{border-left:4px solid var(--ok);display:flex;gap:10px;align-items:center}
/* steps */
.step{display:flex;gap:14px}
.step input[type=checkbox]{appearance:none;flex:none;width:26px;height:26px;border:2px solid var(--violet);border-radius:8px;margin:2px 0 0;cursor:pointer;display:grid;place-content:center;background:transparent}
.step input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok)}
.step input[type=checkbox]:checked::after{content:"✓";color:#10231a;font-weight:800;font-size:16px}
.step.done .body h3{text-decoration:line-through;opacity:.55}
.body{flex:1;min-width:0}
.body h3{margin:0 0 2px;font-size:18px}
.meta{font-size:13px;color:var(--mute);margin-bottom:10px}
ol{margin:8px 0 12px;padding-left:20px}
li{margin:6px 0}
.btn{display:inline-block;background:linear-gradient(90deg,var(--violet),var(--pink));color:#17121f;font-weight:700;text-decoration:none;border-radius:10px;padding:8px 14px;font-size:14px;border:0;cursor:pointer}
.btn.ghost{background:transparent;color:var(--violet);border:1px solid var(--violet)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:2px 6px 2px 9px;margin:1px 0;max-width:100%}
.chip code{overflow-wrap:anywhere}
.chip button{background:none;border:0;color:var(--violet);cursor:pointer;font-size:12px;font-weight:700;padding:2px 4px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
/* services */
.svc{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
.dot.up{background:var(--ok);box-shadow:0 0 0 3px #5fd78722}
.dot.down{background:var(--err)}
.svc a{color:var(--violet);text-decoration:none;font-size:14px}
.svc .d{color:var(--mute);font-size:14px}
/* faq */
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}
summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:8px}
.foot{color:var(--mute);font-size:13px;margin-top:36px}
@media (max-width:520px){h1{font-size:25px}.svc{grid-template-columns:auto 1fr}.svc a{grid-column:2}}
</style>
</head>
<body>
<main>
  <h1 id="title">Almost there.</h1>
  <p class="sub" id="lead"></p>

  <div class="card">
    <div class="pl"><b id="pcount">0 of 0</b> steps done</div>
    <div class="progress"><i id="pbar"></i></div>
  </div>

  <div id="attention"></div>

  <h2>Your steps</h2>
  <div id="steps"></div>

  <h2>Your services</h2>
  <div class="card svc" id="svc"></div>

  <h2>If something's off</h2>
  <div id="faq"></div>

  <h2>Handy commands</h2>
  <div class="card" id="cmds"></div>

  <p class="foot">This page was made by the installer on your Mac and stays there. Your ticks are saved in this browser only.
  Reopen it any time with <span class="mono">./install.sh guide</span>.</p>
</main>

<script>
/*CFG*/
</script>
<script>
(function(){
  var C = window.CFG, R = C.results || [];
  function $(id){return document.getElementById(id)}
  function el(tag, attrs, html){var e=document.createElement(tag);for(var k in (attrs||{}))e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;return e}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function chip(t){return '<span class="chip"><code>'+esc(t)+'</code><button type="button" data-copy="'+esc(t)+'">copy</button></span>'}
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

  var warns = R.filter(function(r){return r.s!=='ok'});
  var oks = R.filter(function(r){return r.s==='ok'}).length;

  /* ---- headline ---- */
  if(warns.length){
    $('title').textContent = 'Nearly done. ' + warns.length + (warns.length===1?' thing needs':' things need') + ' a look.';
    $('lead').textContent = 'Most of the setup worked. Fix the item(s) below first, then do your steps.';
  } else {
    $('title').textContent = 'All set. Four steps to your first movie.';
    $('lead').textContent = 'Everything that could be automated, was. What’s left needs you: your accounts and your TV.';
  }

  /* ---- attention ---- */
  var hints = [
    {re:/download client/i, why:'Radarr or Sonarr couldn’t reach AltMount’s download API.', cmds:['docker compose logs --tail 30 altmount','./install.sh relink']},
    {re:/webhook/i, why:'AltMount couldn’t register its import notifications. It usually just needs AltMount to be fully up.', cmds:['./install.sh status','./install.sh relink']},
    {re:/seerr/i, why:'Seerr wasn’t pre-connected. You can add Radarr and Sonarr in its settings: host radarr / sonarr, ports 7878 / 8989.', cmds:['./install.sh relink']},
    {re:/indexer|prowlarr/i, why:'An indexer was rejected. Usually a typo in the API key or a closed account.', cmds:['./install.sh credentials','./install.sh relink']},
    {re:/docker|runtime|container/i, why:'The container runtime isn’t ready. Start OrbStack or Docker Desktop, then run again.', cmds:['./install.sh up','./install.sh relink']}
  ];
  var att = $('attention');
  if(warns.length){
    warns.forEach(function(w){
      var h = null; hints.some(function(x){if(x.re.test(w.m)){h=x;return true}});
      var cmds = (h?h.cmds:['./install.sh relink']).map(chip).join('<br>');
      att.appendChild(el('div',{'class':'card alert'+(w.s==='err'?' err':'')},
        '<b>'+esc(w.m.replace(/\s*\(details in [^)]*\)/,''))+'</b>'+
        '<div class="why">'+esc(h?h.why:'This step didn’t finish. It’s safe to run again.')+'</div>'+
        '<div>Try:<br>'+cmds+'</div>'+
        '<div class="why" style="margin-top:8px">Details: <span class="mono">logs/clezjelly.log</span></div>'));
    });
  } else if(oks){
    att.appendChild(el('div',{'class':'card good'},'<span style="font-size:22px">✓</span><div><b>'+oks+' setup steps succeeded.</b><div class="pl">Prowlarr, Radarr, Sonarr and AltMount are connected.</div></div>'));
  }

  /* ---- steps ---- */
  var steps = [];
  steps.push({id:'jf', title:'Finish Jellyfin', time:'about 3 minutes', url:'http://localhost:8096', btn:'Open Jellyfin',
    html:'<ol>'+
      '<li>Create your user (pick a name and password you’ll remember).</li>'+
      '<li>When asked to add a library, add <b>Movies</b> and set the folder to<br>'+chip(C.root+'/data/library/movies')+'</li>'+
      '<li>Add a second library, <b>Shows</b>, with the folder<br>'+chip(C.root+'/data/library/tv')+'</li>'+
      '<li>Language: choose your metadata language (e.g. German) and finish the wizard.</li>'+
      '<li>Then <i>Dashboard → Playback → Transcoding</i>: set hardware acceleration to <b>Apple VideoToolbox</b>.</li>'+
    '</ol><div class="pl">The folders are empty for now. That’s normal.</div>'});
  if(C.seerr){
    steps.push({id:'seerr', title:'Sign in to Seerr', time:'1 minute', url:'http://localhost:5055', btn:'Open Seerr',
      html:'<ol>'+
        '<li>Choose <b>Jellyfin</b> as the sign-in method.</li>'+
        '<li>Jellyfin URL: '+chip('http://jellyfin:8096')+'</li>'+
        '<li>Use the Jellyfin user from step 1. Radarr and Sonarr are already connected. If it asks, the hosts are <span class="mono">radarr</span> and <span class="mono">sonarr</span>.</li>'+
      '</ol>'});
  }
  steps.push({id:'test', title:'Request your first movie', time:'2 minutes', url:C.seerr?'http://localhost:5055':'http://localhost:7878', btn:C.seerr?'Open Seerr':'Open Radarr',
    html:'<ol>'+
      (C.seerr?'<li>Search for a film and press <b>Request</b>.</li>':'<li>In Radarr: <i>Add New</i>, search a film, root folder <span class="mono">/data/library/movies</span>, then <b>Add + Search</b>.</li>')+
      '<li>Within a minute it shows up in Radarr under <i>Activity</i>.</li>'+
      '<li>In Jellyfin (<i>Dashboard → Scan all libraries</i> if needed) the title appears. Press play.</li>'+
    '</ol><div class="pl">Nothing is downloaded. Your disk only gets a tiny .strm file.</div>'});
  steps.push({id:'tv', title:'Connect your TV', time:'2 minutes',
    html:'<ol>'+
      '<li>Install the <b>Jellyfin</b> app from your TV’s app store.</li>'+
      '<li>Add a server manually: '+chip('http://'+C.ip+':8096')+'</li>'+
      '<li>Sign in with your Jellyfin user.</li>'+
      '<li>In the app’s playback settings set the maximum bitrate to <b>25 Mbit/s</b>.</li>'+
    '</ol><div class="pl">Tip: reserve this IP for your Mac in your router so it never changes.</div>'});
  if(C.bazarr){
    steps.push({id:'bazarr', title:'Subtitles', time:'3 minutes', optional:true, url:'http://localhost:6767', btn:'Open Bazarr',
      html:'<ol><li><i>Settings → Languages</i>: add your language(s) to a profile and make it the default.</li><li><i>Settings → Providers</i>: enable one or two (OpenSubtitles.com needs a free account).</li></ol>'});
  }

  var KEY='clez-guide:'+C.root;
  var saved={}; try{saved=JSON.parse(store(KEY)||'{}')}catch(e){}
  var wrap=$('steps');
  steps.forEach(function(s,i){
    var box=el('div',{'class':'card step','id':'s-'+s.id});
    box.innerHTML='<input type="checkbox" aria-label="Mark step done" data-id="'+s.id+'">'+
      '<div class="body"><h3>'+(i+1)+'. '+esc(s.title)+(s.optional?'<span class="tag">optional</span>':'')+'</h3>'+
      '<div class="meta">'+esc(s.time)+'</div>'+s.html+
      (s.url?'<a class="btn" target="_blank" rel="noopener" href="'+s.url+'">'+esc(s.btn)+' ↗</a>':'')+'</div>';
    wrap.appendChild(box);
  });
  function paint(){
    var n=0,total=steps.filter(function(s){return !s.optional}).length;
    steps.forEach(function(s){
      var b=$('s-'+s.id); var cb=b.querySelector('input'); var on=!!saved[s.id];
      cb.checked=on; b.classList.toggle('done',on);
      if(on && !s.optional) n++;
    });
    $('pcount').textContent=n+' of '+total;
    $('pbar').style.width=(total?Math.round(n/total*100):0)+'%';
    if(n===total && !warns.length){ $('title').textContent='Done. Enjoy the show.'; $('lead').textContent='Your own streaming service is ready. Request something and press play.'; }
  }
  wrap.addEventListener('change',function(e){
    var id=e.target.getAttribute('data-id'); if(!id)return;
    saved[id]=e.target.checked; store(KEY,JSON.stringify(saved)); paint();
  });
  paint();

  /* ---- services ---- */
  var svcs=[
    ['Jellyfin','http://localhost:8096','your library and player'],
    ['AltMount','http://localhost:8080','Usenet connection'],
    ['Prowlarr','http://localhost:9696','indexers'],
    ['Radarr','http://localhost:7878','movies'],
    ['Sonarr','http://localhost:8989','series']
  ];
  if(C.seerr) svcs.push(['Seerr','http://localhost:5055','request page']);
  if(C.bazarr) svcs.push(['Bazarr','http://localhost:6767','subtitles']);
  var sv=$('svc');
  svcs.forEach(function(s,i){
    sv.appendChild(el('span',{'class':'dot','id':'d'+i}));
    sv.appendChild(el('div',{},'<b>'+s[0]+'</b> <span class="d">· '+s[2]+'</span>'));
    sv.appendChild(el('a',{href:s[1],target:'_blank',rel:'noopener'},'Open ↗'));
    var d=$('d'+i);
    var c=new AbortController(); setTimeout(function(){c.abort()},4000);
    fetch(s[1],{mode:'no-cors',signal:c.signal}).then(function(){d.className='dot up'}).catch(function(){d.className='dot down'});
  });

  /* ---- FAQ ---- */
  var faq=[
    ['A service shows a red dot', '<p>Check what’s running and read the logs of the red one:</p>'+chip('./install.sh status')+'<br>'+chip('docker compose logs --tail 40 <service>')+'<p>Make sure OrbStack or Docker Desktop is running, then:</p>'+chip('./install.sh up')],
    ['A movie was requested but never appears', '<p>Look at Radarr → <i>Activity → Queue</i> and <i>Wanted</i>. No release found usually means the indexers have nothing in your quality profile. Add a second indexer or allow lower qualities.</p><p>Repair the connections:</p>'+chip('./install.sh relink')],
    ['Jellyfin plays it on the Mac but the TV says error', '<p>Some TV apps open the stream link themselves. Let AltMount listen on your network:</p>'+chip('./install.sh components')+'<p>Switch on <b>AltMount on LAN</b> (only on a network you trust). Titles you add afterwards use the new address.</p>'],
    ['The TV can’t find the server', '<p>Same Wi-Fi as the Mac? Try the address in a phone browser: <span class="mono">http://'+esc(C.ip)+':8096</span>. Check that the Mac isn’t asleep and that the macOS firewall allows Jellyfin.</p>'],
    ['Playback buffers', '<p>Lower the bitrate in the TV app to 15 Mbit/s and keep your quality profiles at 1080p.</p>'],
    ['I forgot my passphrase', '<p>It can’t be recovered. Re-enter your logins and set a new one:</p>'+chip('./install.sh credentials')],
    ['Something else', '<p>Run <span class="mono">./install.sh relink</span> (safe to repeat). Then check the last lines of <span class="mono">logs/clezjelly.log</span>. Never share your <span class="mono">.env*</span> files when asking for help.</p>']
  ];
  var fq=$('faq');
  faq.forEach(function(f){fq.appendChild(el('details',{},'<summary>'+esc(f[0])+'</summary>'+f[1]))});

  /* ---- commands ---- */
  $('cmds').innerHTML='<p class="pl">Run these in Terminal inside <span class="mono">'+esc(C.root)+'</span></p>'+
    [['./install.sh','the menu'],['./install.sh status','is everything healthy?'],['./install.sh up','start everything after a restart'],['./install.sh down','stop everything'],['./install.sh update','get newer versions'],['./install.sh backup','save your secrets']]
    .map(function(c){return '<div>'+chip(c[0])+' <span class="d pl">'+esc(c[1])+'</span></div>'}).join('');

  /* ---- copy buttons ---- */
  document.addEventListener('click',function(e){
    var t=e.target.getAttribute&&e.target.getAttribute('data-copy'); if(!t)return;
    var b=e.target;
    function done(){var o=b.textContent;b.textContent='copied';setTimeout(function(){b.textContent=o},1200)}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fallback)}else fallback();
    function fallback(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(x){}document.body.removeChild(ta)}
  });
})();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ClezJelly network and volumes</title>
  <desc id="d">All containers share the clezjelly network and reach each other by service name. Jellyfin runs natively on the Mac and is reachable from containers as jellyfin. Every container sees the same data folder at /data.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e9e6f5}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .box{fill:#1d1a2f;stroke:#a78bfa;stroke-width:1.5}
      .opt{stroke-dasharray:5 4;stroke:#7c6fb0}
      .zone{fill:none;stroke:#f472b6;stroke-width:1.5;stroke-dasharray:2 6;stroke-linecap:round}
      .n{font-size:15px;font-weight:700}
      .s{font-size:12px;fill:#a9a3c4}
      .line{stroke:#a78bfa;stroke-width:1.8;fill:none}
    </style>
  </defs>
  <rect width="960" height="580" rx="16" fill="#14121f"/>
  <text x="40" y="44" font-size="20" font-weight="700" style="fill:url(#g)">One network, one data folder</text>
  <text x="40" y="64" class="s">Containers talk by name. Paths are identical everywhere.</text>

  <!-- Mac host -->
  <rect class="zone" x="30" y="90" width="230" height="270" rx="16"/>
  <text x="48" y="116" class="s">macOS (native)</text>
  <rect class="box" x="50" y="136" width="190" height="86" rx="12"/>
  <text class="n" x="145" y="164" text-anchor="middle">Jellyfin.app</text>
  <text class="s mono" x="145" y="186" text-anchor="middle">localhost:8096</text>
  <text class="s" x="145" y="206" text-anchor="middle">hardware transcoding</text>
  <rect class="box" x="50" y="248" width="190" height="86" rx="12"/>
  <text class="n" x="145" y="276" text-anchor="middle">Browser</text>
  <text class="s mono" x="145" y="298" text-anchor="middle">localhost:7878 …</text>
  <text class="s" x="145" y="318" text-anchor="middle">ports bind to 127.0.0.1</text>

  <!-- Docker network -->
  <rect class="zone" x="290" y="90" width="640" height="270" rx="16"/>
  <text x="308" y="116" class="s">Docker / OrbStack · network</text>
  <text x="528" y="116" class="s mono" style="fill:#f472b6">clezjelly</text>

  <g>
    <rect class="box" x="310" y="136" width="190" height="86" rx="12"/><text class="n" x="405" y="164" text-anchor="middle">altmount</text><text class="s mono" x="405" y="186" text-anchor="middle">altmount:8080</text><text class="s" x="405" y="206" text-anchor="middle">Usenet · WebDAV · API</text>
    <rect class="box" x="520" y="136" width="190" height="86" rx="12"/><text class="n" x="615" y="164" text-anchor="middle">prowlarr</text><text class="s mono" x="615" y="186" text-anchor="middle">prowlarr:9696</text><text class="s" x="615" y="206" text-anchor="middle">indexers</text>
    <rect class="box opt" x="730" y="136" width="180" height="86" rx="12"/><text class="n" x="820" y="164" text-anchor="middle">seerr</text><text class="s mono" x="820" y="186" text-anchor="middle">seerr:5055</text><text class="s" x="820" y="206" text-anchor="middle">requests · optional</text>
    <rect class="box" x="310" y="248" width="190" height="86" rx="12"/><text class="n" x="405" y="276" text-anchor="middle">radarr</text><text class="s mono" x="405" y="298" text-anchor="middle">radarr:7878</text><text class="s" x="405" y="318" text-anchor="middle">movies</text>
    <rect class="box" x="520" y="248" width="190" height="86" rx="12"/><text class="n" x="615" y="276" text-anchor="middle">sonarr</text><text class="s mono" x="615" y="298" text-anchor="middle">sonarr:8989</text><text class="s" x="615" y="318" text-anchor="middle">series</text>
    <rect class="box opt" x="730" y="248" width="180" height="86" rx="12"/><text class="n" x="820" y="276" text-anchor="middle">bazarr</text><text class="s mono" x="820" y="298" text-anchor="middle">bazarr:6767</text><text class="s" x="820" y="318" text-anchor="middle">subtitles · optional</text>
  </g>

  <path class="line" d="M242 180H308" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="275" y="172" class="s mono" text-anchor="middle">jellyfin</text>

  <!-- volumes -->
  <text x="40" y="400" font-size="15" font-weight="700">Volumes</text>
  <rect class="box" x="40" y="414" width="560" height="140" rx="12"/>
  <text class="s mono" x="60" y="440" style="fill:#f472b6">./data  →  /data</text>
  <text class="s" x="230" y="440">shared by altmount · radarr · sonarr · bazarr</text>
  <g>
    <text class="s mono" x="60" y="466">data/</text>
    <text class="s mono" x="80" y="486">├─ strm/             <tspan style="fill:#a9a3c4">AltMount drops .strm here</tspan></text>
    <text class="s mono" x="80" y="506">└─ library/</text>
    <text class="s mono" x="100" y="526">├─ movies/         <tspan style="fill:#a9a3c4">Radarr root = Jellyfin "Movies"</tspan></text>
    <text class="s mono" x="100" y="546">└─ tv/             <tspan style="fill:#a9a3c4">Sonarr root = Jellyfin "Shows"</tspan></text>
  </g>
  <rect class="box" x="620" y="414" width="300" height="140" rx="12"/>
  <text class="s mono" x="640" y="440" style="fill:#f472b6">./config/&lt;name&gt;  →  /config</text>
  <text class="s" x="640" y="466">One private folder per service:</text>
  <text class="s mono" x="640" y="488">altmount  prowlarr  radarr</text>
  <text class="s mono" x="640" y="508">sonarr  bazarr  seerr</text>
  <text class="s" x="640" y="534">Seerr mounts it at /app/config.</text>
</svg>

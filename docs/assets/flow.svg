<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ClezJelly request flow</title>
  <desc id="d">A request travels from Seerr to Radarr or Sonarr, which search through Prowlarr, grab via AltMount, which reads Usenet and writes STRM files. Jellyfin scans the library and streams on demand through AltMount to the TV.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f472b6"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e9e6f5}
      .box{fill:#1d1a2f;stroke:#a78bfa;stroke-width:1.5}
      .opt{stroke-dasharray:5 4;stroke:#7c6fb0}
      .ext{fill:#241c33;stroke:#f472b6}
      .n{font-size:15px;font-weight:700}
      .s{font-size:12px;fill:#a9a3c4}
      .l{font-size:12px;fill:#c9c3e6}
      .num{fill:url(#g)}
      .nt{font-size:12px;font-weight:700;fill:#14121f;text-anchor:middle}
      .line{stroke:#a78bfa;stroke-width:1.8;fill:none}
      .dash{stroke:#f472b6;stroke-width:1.8;fill:none;stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="960" height="520" rx="16" fill="#14121f"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="url(#g)" style="fill:url(#g)">How a request becomes a stream</text>
  <text x="40" y="64" class="s">Solid lines: requests and files · dashed: video bytes</text>

  <!-- row 1 -->
  <rect class="box" x="40" y="100" width="130" height="64" rx="12"/>
  <text class="n" x="105" y="128" text-anchor="middle">You</text><text class="s" x="105" y="148" text-anchor="middle">phone · browser</text>

  <rect class="box opt" x="230" y="100" width="140" height="64" rx="12"/>
  <text class="n" x="300" y="128" text-anchor="middle">Seerr</text><text class="s" x="300" y="148" text-anchor="middle">request UI · optional</text>

  <rect class="box" x="430" y="100" width="180" height="64" rx="12"/>
  <text class="n" x="520" y="128" text-anchor="middle">Radarr · Sonarr</text><text class="s" x="520" y="148" text-anchor="middle">rules · quality · naming</text>

  <rect class="box" x="710" y="100" width="190" height="64" rx="12"/>
  <text class="n" x="805" y="128" text-anchor="middle">Prowlarr</text><text class="s" x="805" y="148" text-anchor="middle">NZBGeek + your 2nd indexer</text>

  <!-- row 2 -->
  <rect class="box" x="430" y="250" width="180" height="64" rx="12"/>
  <text class="n" x="520" y="278" text-anchor="middle">AltMount</text><text class="s" x="520" y="298" text-anchor="middle">SABnzbd API · WebDAV</text>

  <rect class="box ext" x="710" y="250" width="190" height="64" rx="12"/>
  <text class="n" x="805" y="278" text-anchor="middle">Eweka</text><text class="s" x="805" y="298" text-anchor="middle">Usenet provider</text>

  <!-- row 3 -->
  <rect class="box" x="430" y="396" width="180" height="64" rx="12"/>
  <text class="n" x="520" y="424" text-anchor="middle">Library</text><text class="s" x="520" y="444" text-anchor="middle">.strm files · data/library</text>

  <rect class="box" x="230" y="396" width="140" height="64" rx="12"/>
  <text class="n" x="300" y="424" text-anchor="middle">Jellyfin</text><text class="s" x="300" y="444" text-anchor="middle">native macOS app</text>

  <rect class="box ext" x="40" y="396" width="130" height="64" rx="12"/>
  <text class="n" x="105" y="424" text-anchor="middle">Your TV</text><text class="s" x="105" y="444" text-anchor="middle">Samsung · Tizen</text>

  <!-- arrows -->
  <path class="line" d="M170 132H228" marker-end="url(#a)"/>
  <path class="line" d="M370 132H428" marker-end="url(#a)"/>
  <path class="line" d="M610 132H708" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="line" d="M520 164V248" marker-end="url(#a)"/>
  <path class="line" d="M610 282H708" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="line" d="M520 314V394" marker-end="url(#a)"/>
  <path class="line" d="M430 428H372" marker-end="url(#a)"/>
  <path class="line" d="M230 428H172" marker-end="url(#a)"/>
  <path class="dash" d="M330 394C350 340 400 300 428 290" marker-end="url(#m)"/>

  <!-- numbered badges -->
  <g class="num"><circle cx="199" cy="132" r="11"/><circle cx="399" cy="132" r="11"/><circle cx="659" cy="132" r="11"/><circle cx="520" cy="206" r="11"/><circle cx="659" cy="282" r="11"/><circle cx="520" cy="354" r="11"/><circle cx="401" cy="428" r="11"/><circle cx="201" cy="428" r="11"/><circle cx="392" cy="334" r="11" style="fill:#f472b6"/></g>
  <g>
    <text class="nt" x="199" y="136">1</text><text class="nt" x="399" y="136">2</text><text class="nt" x="659" y="136">3</text>
    <text class="nt" x="520" y="210">4</text><text class="nt" x="659" y="286">5</text><text class="nt" x="520" y="358">6</text>
    <text class="nt" x="401" y="432">7</text><text class="nt" x="201" y="432">8</text><text class="nt" x="392" y="338">9</text>
  </g>

  <!-- legend -->
  <g class="l">
    <text x="660" y="372">1 You pick a title</text>
    <text x="660" y="390">2 Seerr asks Radarr / Sonarr</text>
    <text x="660" y="408">3 Prowlarr searches your indexers</text>
    <text x="660" y="426">4 Best release goes to AltMount</text>
    <text x="660" y="444">5 AltMount checks it on Usenet</text>
    <text x="660" y="462">6 A tiny .strm file lands in the library</text>
    <text x="660" y="480">7 Jellyfin scans · 8 You press play</text>
    <text x="660" y="498">9 Video streams on demand, nothing stored</text>
  </g>
</svg>

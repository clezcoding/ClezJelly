<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">ClezJelly</title>
  <desc id="desc">Minimal neon cyan-to-violet jellyfish mascot forming a C, with ClezJelly wordmark.</desc>
  <defs>
    <linearGradient id="jelly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19F5E8"/>
      <stop offset=".48" stop-color="#168BFF"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="wordClez" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19F5E8"/><stop offset="1" stop-color="#168BFF"/>
    </linearGradient>
    <linearGradient id="wordJelly" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B5CFF"/><stop offset="1" stop-color="#E05BEE"/>
    </linearGradient>
  </defs>
  <!-- Jellyfish bell shaped like a C -->
  <path d="M650 190 C565 125 425 135 350 220 C270 311 270 438 330 505 C360 538 394 540 430 526 C488 504 531 532 573 539 C625 548 671 522 695 489 C718 457 704 422 675 407 C644 391 615 407 585 425 C541 452 493 449 461 422 C423 390 423 333 461 297 C503 257 558 257 600 281 C636 301 674 289 690 259 C705 231 684 208 650 190 Z" fill="url(#jelly)"/>
  <!-- subtle inner highlight -->
  <path d="M367 265 C402 205 462 180 519 183" fill="none" stroke="#B7FFF9" stroke-width="13" stroke-linecap="round" opacity=".8"/>
  <!-- happy eyes -->
  <path d="M458 353 Q458 330 477 330 Q496 330 496 353" fill="none" stroke="#72FFE2" stroke-width="13" stroke-linecap="round"/>
  <path d="M548 353 Q548 330 567 330 Q586 330 586 353" fill="none" stroke="#72FFE2" stroke-width="13" stroke-linecap="round"/>
  <!-- flowing tentacles -->
  <g fill="none" stroke="url(#jelly)" stroke-width="25" stroke-linecap="round">
    <path d="M390 526 C396 583 365 612 348 645 C335 671 344 695 359 710"/>
    <path d="M454 535 C461 589 438 617 423 645 C407 676 420 704 438 720"/>
    <path d="M514 540 C514 595 500 626 502 654 C504 687 529 704 542 727"/>
    <path d="M575 534 C581 582 601 609 621 633 C643 660 635 686 622 701"/>
  </g>
  <!-- tiny pixel sparks -->
  <g fill="#55F6E7"><rect x="295" y="570" width="18" height="18" rx="2"/><rect x="321" y="593" width="12" height="12" rx="1"/><rect x="674" y="584" width="16" height="16" rx="2"/></g>
  <!-- wordmark -->
  <text x="500" y="845" text-anchor="middle" font-family="Inter, Montserrat, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-5"><tspan fill="url(#wordClez)">Clez</tspan><tspan fill="url(#wordJelly)">Jelly</tspan></text>
</svg>

# ══════════════════════════════════════════════════════════════════
#  ClezJelly — docker-compose.yml
#
#  Every container joins one private network ("clezjelly") and can reach
#  the others by plain service name:
#
#      altmount  prowlarr  radarr  sonarr  bazarr  seerr
#      jellyfin  → the native macOS app (host-gateway alias)
#
#  Every container sees the same tree at /data, so paths agree everywhere:
#
#      ./data/strm              AltMount drops .strm files here (staging)
#      ./data/library/movies    Radarr root folder  = Jellyfin "Movies"
#      ./data/library/tv        Sonarr root folder  = Jellyfin "Shows"
#
#  Ports bind to 127.0.0.1 unless you opted into LAN access in the
#  installer (see .env — generated by ./install.sh, never edit by hand).
# ══════════════════════════════════════════════════════════════════

name: clezjelly

x-common: &common
  restart: unless-stopped
  networks: [clezjelly]
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "jellyfin:host-gateway"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-env: &env
  PUID: ${PUID:-501}
  PGID: ${PGID:-20}
  TZ: ${TZ:-Europe/Vienna}
  UMASK: "002"

networks:
  clezjelly:
    name: clezjelly

services:
  # ── AltMount ────────────────────────────────────────────────────
  # Usenet → WebDAV + SABnzbd-compatible API. Writes .strm files.
  # UI: http://localhost:8080
  altmount:
    <<: *common
    # Apple Silicon build. On Intel, override with ALTMOUNT_IMAGE=ghcr.io/javi11/altmount:latest
    image: ${ALTMOUNT_IMAGE:-ghcr.io/kipsilabs/altmount:dev-arm64-temp}
    container_name: clezjelly-altmount
    hostname: altmount
    ports:
      - "${ALTMOUNT_BIND:-127.0.0.1}:8080:8080"
    environment:
      <<: *env
      PORT: "8080"
      JWT_SECRET: ${ALTMOUNT_JWT_SECRET:?run ./install.sh first, it generates .env}
      COOKIE_DOMAIN: localhost
    volumes:
      - ./config/altmount:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || curl -fs -o /dev/null http://localhost:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Prowlarr ────────────────────────────────────────────────────
  # One place for indexers; pushes them to Radarr and Sonarr.
  # UI: http://localhost:9696
  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: clezjelly-prowlarr
    hostname: prowlarr
    ports:
      - "127.0.0.1:9696:9696"
    environment:
      <<: *env
    volumes:
      - ./config/prowlarr:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9696/ping || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Radarr ──────────────────────────────────────────────────────
  # Movies: search, quality rules, naming, hand-off to AltMount.
  # UI: http://localhost:7878
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: clezjelly-radarr
    hostname: radarr
    ports:
      - "127.0.0.1:7878:7878"
    environment:
      <<: *env
    volumes:
      - ./config/radarr:/config
      - ./data:/data
    depends_on:
      altmount:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:7878/ping || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Sonarr ──────────────────────────────────────────────────────
  # Series: same job as Radarr, for episodes.
  # UI: http://localhost:8989
  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: clezjelly-sonarr
    hostname: sonarr
    ports:
      - "127.0.0.1:8989:8989"
    environment:
      <<: *env
    volumes:
      - ./config/sonarr:/config
      - ./data:/data
    depends_on:
      altmount:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8989/ping || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Seerr (optional · profile "seerr") ──────────────────────────
  # Request UI: search a title, press Request, done.
  # UI: http://localhost:5055   (successor of Jellyseerr / Overseerr)
  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:latest
    container_name: clezjelly-seerr
    hostname: seerr
    profiles: ["seerr"]
    init: true
    ports:
      - "${SEERR_BIND:-127.0.0.1}:5055:5055"
    environment:
      TZ: ${TZ:-Europe/Vienna}
      LOG_LEVEL: info
      PORT: "5055"
    volumes:
      - ./config/seerr:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Bazarr (optional · profile "bazarr") ────────────────────────
  # Subtitles for everything Radarr and Sonarr know about.
  # UI: http://localhost:6767
  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:latest
    container_name: clezjelly-bazarr
    hostname: bazarr
    profiles: ["bazarr"]
    ports:
      - "127.0.0.1:6767:6767"
    environment:
      <<: *env
    volumes:
      - ./config/bazarr:/config
      - ./data:/data
    depends_on:
      radarr:
        condition: service_started
      sonarr:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:6767/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
